[package]
name = "mclauncher-core"
version = "0.1.0"
edition = "2021"
description = "Minecraft launch, authlib-injector login, and BMCLAPI/official downloads"
license = "MIT"
publish = false

[dependencies]
directories = "5"
futures-util = "0.3"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
