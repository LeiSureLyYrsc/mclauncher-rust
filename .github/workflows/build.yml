name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            label: windows
          - os: ubuntu-24.04
            args: ""
            label: linux
          - os: macos-latest
            args: "--target universal-apple-darwin"
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Test core
        run: cargo test --manifest-path crates/mclauncher-core/Cargo.toml --locked

      - name: Install Tauri CLI
        run: npm ci

      - name: Generate bundle icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build
        run: npx tauri build --verbose ${{ matrix.args }}

      - name: Collect single-file outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp src-tauri/target/release/mclauncher-rust.exe dist-out/mclauncher-rust-windows-x64.exe
            shopt -s nullglob
            setups=(src-tauri/target/release/bundle/nsis/*-setup.exe)
            if [ ${#setups[@]} -gt 0 ]; then
              cp "${setups[0]}" dist-out/mclauncher-rust-windows-x64-setup.exe
            fi
          elif [ "${{ runner.os }}" = "Linux" ]; then
            shopt -s nullglob
            apps=(src-tauri/target/release/bundle/appimage/*.AppImage)
            if [ ${#apps[@]} -eq 0 ]; then
              echo "AppImage not found" >&2
              find src-tauri/target/release/bundle -maxdepth 3 -type f >&2 || true
              exit 1
            fi
            cp "${apps[0]}" dist-out/mclauncher-rust-linux-x64.AppImage
            chmod +x dist-out/mclauncher-rust-linux-x64.AppImage
          else
            shopt -s nullglob
            dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/dmg/*.dmg)
            if [ ${#dmgs[@]} -eq 0 ]; then
              echo "dmg not found" >&2
              find src-tauri/target -name '*.dmg' >&2 || true
              exit 1
            fi
            cp "${dmgs[0]}" dist-out/mclauncher-rust-macos-universal.dmg
          fi
          ls -lah dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: mclauncher-${{ matrix.label }}
          path: dist-out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mclauncher-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
